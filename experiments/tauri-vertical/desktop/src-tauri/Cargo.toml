[package]
name = "aw-vertical-desktop"
version = "0.1.0"
edition = "2024"
publish = false

[build-dependencies]
tauri-build = { version = "=2.7.4", features = [] }

[dependencies]
tauri = { version = "=2.12.5", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-dialog = "=2.8.4"
libc = "0.2"
tauri-plugin-notification = "=2.8.1"

[features]
custom-protocol = ["tauri/custom-protocol"]

[profile.dev]
debug = 0
incremental = false
