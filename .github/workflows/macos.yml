name: macOS native checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: macos-${{ github.ref }}
  cancel-in-progress: true
jobs:
  native:
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable action snapshot
        with:
          toolchain: stable
      # Browser suites use the runner image's Google Chrome (channel: chrome)
      # and Playwright WebKit, installed here at the version package-lock pins.
      - name: Install Playwright WebKit for the browser suites
        working-directory: experiments/tauri-vertical/desktop
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npx playwright install webkit
      - name: Build frontend, run unit and browser suites, test disposable fixtures, compile native app
        run: python3 scripts/build-macos.py
